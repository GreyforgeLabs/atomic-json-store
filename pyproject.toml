[build-system]
requires = ["setuptools==83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "atomic-json-store"
version = "1.0.1"
description = "Atomic, cross-process locked, schema-versioned JSON persistence with zero dependencies."
readme = "README.md"
requires-python = ">=3.11"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
authors = [
  { name = "Greyforge", email = "admin@greyforge.tech" },
]
keywords = ["json", "persistence", "atomic", "file-lock", "schema-migration", "state", "cli"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: POSIX",
  "Operating System :: MacOS",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Database",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: System :: Filesystems",
]
dependencies = []

[project.optional-dependencies]
dev = [
  "build==1.4.2",
  "pytest==9.0.3",
  "ruff==0.15.0",
  "twine==6.1.0",
]

[project.scripts]
atomic-json-store = "atomic_json_store.cli:main"

[project.urls]
Homepage = "https://greyforge.tech/open-source"
Repository = "https://github.com/GreyforgeLabs/atomic-json-store"
Issues = "https://github.com/GreyforgeLabs/atomic-json-store/issues"
Changelog = "https://github.com/GreyforgeLabs/atomic-json-store/blob/main/CHANGELOG.md"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.format]
quote-style = "double"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]
