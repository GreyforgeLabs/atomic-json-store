name: Publish PyPI

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to publish. Use a release tag such as v1.0.0."
        required: true
        default: "v1.0.0"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: pypi
      url: https://pypi.org/p/atomic-json-store
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.12"
      - name: Validate publish tag matches project version
        env:
          PUBLISH_REF: ${{ inputs.ref }}
        run: |
          set -euo pipefail

          case "$PUBLISH_REF" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *)
              echo "Publish ref must be a version tag like v1.0.0"
              exit 1
              ;;
          esac

          TAG_VERSION="${PUBLISH_REF#v}"
          PROJECT_VERSION="$(python - <<'PY'
          import tomllib
          with open("pyproject.toml", "rb") as handle:
              data = tomllib.load(handle)
          print(data["project"]["version"])
          PY
          )"

          if [ "$TAG_VERSION" != "$PROJECT_VERSION" ]; then
            echo "Publish tag $TAG_VERSION does not match project.version $PROJECT_VERSION"
            exit 1
          fi

          HEAD_SHA="$(git rev-parse HEAD)"
          TAG_SHA="$(git rev-list -n 1 "$PUBLISH_REF")"
          if [ "$HEAD_SHA" != "$TAG_SHA" ]; then
            echo "Checked-out commit does not match tag $PUBLISH_REF"
            exit 1
          fi
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m ruff check .
      - run: python -m pytest
      - run: python -m build
      - run: python -m twine check dist/*
      - uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # release/v1
